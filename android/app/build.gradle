plugins {
    id "com.android.application"
}

android {
    namespace "fr.minitele.app"
    compileSdk 34

    defaultConfig {
        applicationId "fr.minitele.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        sideload {
            storeFile file("${rootDir}/keystore/minitele-debug.keystore")
            storePassword "minitele"
            keyAlias "minitele"
            keyPassword "minitele"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.sideload
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.sideload
        }
    }
}
